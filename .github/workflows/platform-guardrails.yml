name: Platform Guardrails
on:
  push:
  pull_request:
jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform Format
        run: terraform fmt -check -recursive
      - name: Terraform Init and Validate
        run: find . -name "*.tf" -type f -exec dirname {} \; | sort -u | while read dir; do terraform -chdir="$dir" init -backend=false -input=false && terraform -chdir="$dir" validate; done
      - name: Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          quiet: true
      - name: Kubernetes Client Validation
        run: find applications kubernetes monitoring -type f \( -name "*.yaml" -o -name "*.yml" \) -print0 | xargs -0 -r -n1 kubectl apply --dry-run=client -f
